[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosronnx"
dynamic = ["version"]
description = "Pure-ONNX multi-engine audio super-resolution / bandwidth extension (upscale speech to 48 kHz)"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Intended Audience :: Developers",
]
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "audio super resolution", "bandwidth extension", "speech enhancement",
    "speech restoration", "onnx", "upsampling", "lavasr", "novasr", "sidon",
    "callenhancer", "telephony", "call centre", "48khz",
]
dependencies = [
    "numpy",
    "onnxruntime>=1.17",
    "huggingface_hub",
    "scipy",
    "soundfile",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/audiosronnx"
Repository = "https://github.com/TigreGotico/audiosronnx"

[project.scripts]
audiosronnx = "audiosronnx.cli:main"

[project.optional-dependencies]
# test deps — NO heavy ML deps; unit tests run without downloading weights
test = ["pytest", "pytest-cov"]
# DeepFilterNet3 denoiser: libdf supplies its STFT/ERB frontend + synthesis. A small Rust
# wheel — no torch, so inference stays onnxruntime-only.
deepfilternet = ["DeepFilterLib"]
# model conversion / publishing (maintainer only; needs torch + the upstream models)
convert = ["torch", "torchaudio", "onnx", "huggingface_hub", "vocos", "einops", "gdown", "transformers", "descript-audio-codec"]
# cross-engine benchmark harness (benchmarks/). Pulls the metrics library and the
# HuggingFace `datasets` streaming loaders; no torch in the scoring path. See
# benchmarks/ and docs for how to run the board.
benchmark = ["speechonnxmetrics>=0.0.1", "datasets", "soundfile"]

[tool.setuptools.dynamic]
version = {attr = "audiosronnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["audiosronnx*"]

[tool.setuptools.package-data]
"audiosronnx" = ["data/*"]

[tool.pytest.ini_options]
# The benchmark floor test downloads multi-GB weights + gold audio, so it is
# opt-in only: `pytest -m benchmark`. The default suite stays offline and fast.
markers = [
    "benchmark: cross-engine benchmark floor checks (opt-in; downloads weights + datasets)",
]
addopts = "-m 'not benchmark'"
